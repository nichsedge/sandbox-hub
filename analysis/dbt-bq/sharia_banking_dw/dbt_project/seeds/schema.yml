version: 2

seeds:
  - name: raw_customers
    description: "Master list of Sharia banking customers in Indonesia"
    config:
      column_types:
        customer_id: varchar
        nik: varchar
        full_name: varchar
        customer_segment: varchar
        branch_code: varchar
        branch_name: varchar
        city: varchar
        birth_date: date
        is_sharia_compliant_flag: boolean
        created_at: date
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: nik
        tests:
          - unique
          - not_null

  - name: raw_accounts
    description: "Sharia deposit & savings accounts (Wadiah & Mudharabah)"
    config:
      column_types:
        account_id: varchar
        customer_id: varchar
        account_number: varchar
        product_type: varchar
        akad_type: varchar
        currency: varchar
        indicative_nisbah_customer_pct: double
        status: varchar
        opened_date: date
    columns:
      - name: account_id
        tests:
          - unique
          - not_null
      - name: akad_type
        tests:
          - accepted_values:
              values: ['WADIAH_YAD_DHAMANAH', 'MUDHARABAH_MUTLAQAH', 'MUDHARABAH_MUQAYYADAH']


  - name: raw_financing_contracts
    description: "Sharia financing contracts (Murabahah cost-plus & Musyarakah partnership)"
    config:
      column_types:
        contract_id: varchar
        customer_id: varchar
        contract_number: varchar
        akad_type: varchar
        financing_sector: varchar
        principal_amount: double
        margin_amount: double
        total_financing_amount: double
        monthly_installment: double
        tenor_months: integer
        start_date: date
        end_date: date
        ojk_kolektibilitas: integer
        outstanding_principal: double
    columns:
      - name: contract_id
        tests:
          - unique
          - not_null
      - name: akad_type
        tests:
          - accepted_values:
              values: ['MURABAHAH', 'MUSYARAKAH', 'IJARAH']
      - name: ojk_kolektibilitas
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]

  - name: raw_daily_transactions
    description: "Daily customer transactions ledger"
    config:
      column_types:
        transaction_id: varchar
        account_id: varchar
        transaction_date: date
        transaction_type: varchar
        db_cr_flag: varchar
        amount: double
        channel: varchar
        description: varchar
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: db_cr_flag
        tests:
          - accepted_values:
              values: ['DB', 'CR']


  - name: raw_bank_income_pool
    description: "Monthly gross income pool generated by the bank for Mudharabah profit sharing distribution"
    columns:
      - name: period_month
        tests:
          - not_null

  - name: raw_purification_fund
    description: "Sharia governance purification records (Ta'zir penalties and non-halal income allocated to Qardh Hasan)"
    columns:
      - name: record_id
        tests:
          - unique
          - not_null
