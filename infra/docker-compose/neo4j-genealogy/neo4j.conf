# Neo4j Configuration for Genealogy Project

# Bolt connector
dbms.connector.bolt.enabled=true
dbms.connector.bolt.listen_address=:7687
dbms.connector.bolt.advertised_address=localhost:8687

# HTTP connector
dbms.connector.http.enabled=true
dbms.connector.http.listen_address=:7474
dbms.connector.http.advertised_address=localhost:8474

# Memory settings (will be overridden by environment variables)
dbms.memory.heap.initial_size=512m
dbms.memory.heap.max_size=1g
dbms.memory.pagecache.size=256m

# Security
dbms.security.auth_enabled=true
dbms.connector.bolt.tls_level=OPTIONAL

# Logging
dbms.logs.default_level=INFO
dbms.logs.query.enabled=true
dbms.logs.query.level=INFO

# Security settings for remote shell
dbms.shell.remote_enabled=false
dbms.shell.heap_max_size=512M

# Database settings
dbms.tx_state_memory_allocation=50M
dbms.default_database=neo4j
dbms.security.procedures.unrestricted=apoc.*,graph-algorithms.*
dbms.security.procedures.allowlist=apoc.*,graph-algorithms.*

# Genealogy-specific settings
dbms.schema.constraint_index_population_minimum=1
dbms.schema.constraint_index_population_maximum=100
dbms.schema.constraint_index_population_default=50
