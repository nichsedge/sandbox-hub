version: '3.8'

services:
  neo4j-idx:
    image: neo4j:latest
    container_name: neo4j-idx
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - neo4j_idx_data:/data
      - neo4j_idx_logs:/logs
      - neo4j_idx_config:/config
      - neo4j_idx_plugins:/plugins
      - ./neo4j.conf:/etc/neo4j/neo4j.conf
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - neo4j_idx_network

volumes:
  neo4j_idx_data:
  neo4j_idx_logs:
  neo4j_idx_config:
  neo4j_idx_plugins:

networks:
  neo4j_idx_network:
    driver: bridge
