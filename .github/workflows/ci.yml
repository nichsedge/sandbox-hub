name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  projects:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [analysis/dbt-bq, analysis/crypto-data, tools/email-py, ai/video2text, ai/text2audio]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked
        working-directory: ${{ matrix.project }}
